<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>us. — movies</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .add-row {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }
  .add-row input {
    flex: 1;
  }
  .legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .legend .item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--ink-soft);
  }
  .swatch {
    width: 12px;
    height: 12px;
    border-radius: 4px;
    border: 1px solid var(--line);
  }
  .swatch.default { background: var(--paper); }
  .swatch.seen { background: var(--dim-red-pale); border-color: var(--dim-red); }
  .swatch.towatch { background: var(--sage-pale); border-color: var(--sage); }

  .movie-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .movie-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    cursor: pointer;
    background: var(--paper);
    color: var(--ink);
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .movie-item:hover {
    transform: translateY(-1px);
  }
  .movie-item .title {
    font-size: 1rem;
  }
  .movie-item .status-label {
    font-size: 0.75rem;
    color: var(--ink-soft);
    flex-shrink: 0;
  }
  .movie-item.seen {
    background: var(--dim-red-pale);
    border-color: var(--dim-red);
  }
  .movie-item.seen .title { color: var(--dim-red); }
  .movie-item.towatch {
    background: var(--sage-pale);
    border-color: var(--sage);
  }
  .movie-item.towatch .title { color: var(--sage); }

  .delete-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 1rem;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
    line-height: 1;
  }
  .delete-btn:hover {
    background: rgba(0,0,0,0.06);
    color: var(--ink);
  }
  .empty-state {
    text-align: center;
    color: var(--ink-soft);
    padding: 30px 10px;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <span class="brand">us.</span>
      <div class="row" style="gap: 16px;">
        <span class="muted" id="sync-status">connecting…</span>
        <a class="nav-link" href="home.html">← home</a>
      </div>
    </div>

    <div class="card">
      <h2>Movies</h2>
      <p class="muted">Click a title to mark it as seen or as next up.</p>

      <form class="add-row" id="add-form">
        <input type="text" id="add-input" placeholder="Add a movie title…" />
        <button type="submit" class="btn">Add</button>
      </form>

      <div class="legend">
        <span class="item"><span class="swatch default"></span> unmarked</span>
        <span class="item"><span class="swatch seen"></span> seen together</span>
        <span class="item"><span class="swatch towatch"></span> to watch</span>
      </div>

      <div class="movie-list" id="movie-list"></div>
    </div>
  </div>

  <script src="js/guard.js"></script>
  <script type="module" src="js/movies.js"></script>
</body>
</html>
