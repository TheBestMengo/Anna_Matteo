<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>us. — home</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .counter-wrap {
    text-align: center;
    padding: 20px 10px 8px;
  }
  .counter-eyebrow {
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin-bottom: 6px;
  }
  .counter-days {
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: clamp(3.2rem, 14vw, 6.2rem);
    color: var(--plum-dark);
    line-height: 1;
    margin: 6px 0;
  }
  .counter-days .unit {
    font-size: 0.32em;
    font-weight: 500;
    color: var(--ink-soft);
    margin-left: 6px;
  }
  .sub-counters {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin: 18px 0 26px;
    flex-wrap: wrap;
  }
  .sub-counter {
    min-width: 70px;
  }
  .sub-counter .n {
    font-family: "Fraunces", serif;
    font-size: 1.6rem;
    font-weight: 600;
  }
  .sub-counter .l {
    font-size: 0.78rem;
    color: var(--ink-soft);
  }
  .target-date {
    color: var(--ink-soft);
    font-size: 0.92rem;
    margin-bottom: 22px;
  }
  #date-form {
    display: none;
    justify-content: center;
    gap: 10px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  #date-form.open {
    display: flex;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <span class="brand">us.</span>
      <div class="row" style="gap: 16px;">
        <span class="muted" id="sync-status">connecting…</span>
        <a class="nav-link" href="#" id="logout-link">lock this page</a>
      </div>
    </div>

    <div class="card">
      <div class="counter-wrap">
        <div class="counter-eyebrow" id="counter-eyebrow">until we're together again</div>
        <div class="counter-days" id="days-display">— <span class="unit">days</span></div>

        <div class="sub-counters">
          <div class="sub-counter"><div class="n" id="hours-display">00</div><div class="l">hours</div></div>
          <div class="sub-counter"><div class="n" id="minutes-display">00</div><div class="l">minutes</div></div>
          <div class="sub-counter"><div class="n" id="seconds-display">00</div><div class="l">seconds</div></div>
        </div>

        <div class="target-date" id="target-date-label"></div>

        <button class="btn secondary" id="toggle-date-btn">Set the date</button>

        <form id="date-form">
          <input type="date" id="date-input" />
          <button type="submit" class="btn">Save</button>
          <button type="button" class="btn ghost" id="cancel-date-btn">Cancel</button>
        </form>
      </div>
    </div>

    <div class="destinations">
      <a class="destination" href="calendar.html">
        <span class="label">Calendar</span>
        <span class="hint">Plans, visits, and little reminders</span>
      </a>
      <a class="destination" href="movies.html">
        <span class="label">Movies</span>
        <span class="hint">What we've watched, what's next</span>
      </a>
    </div>
  </div>

  <script src="js/guard.js"></script>
  <script type="module" src="js/home.js"></script>
</body>
</html>
